name: CodeThread
thesis_title: Code Comprehension Enhancement using Visual Test Trace
north_star:
  Help developers understand unfamiliar source and software systems through
  evidence-backed code relationships and bounded interactive tracing.
audience: A single developer investigating a local repository.
v0:
  source: >-
    A standard local Git checkout supplies one pinned commit. The repository
    scope admits all regular .ts blobs and bounded compiler/workspace metadata;
    the selected-file and metadata-only browse workflows remain available.
    Original verified bytes live only in the in-memory session.
  language: >-
    TypeScript .ts files only. .tsx, JavaScript, ambient machine types and
    repository-installed dependencies are outside this MVP.
  optional_test_analysis: Jest behavior can provide supporting evidence.
  framework_extensions:
    Supported NestJS patterns may enrich generic TypeScript facts.
  evidence: Static source facts with explicit resolution and coverage.
  navigation:
    - Source file, module, symbol, or supported entry point to related code and
      exact evidence.
    - Symbol to supported references, dependencies, calls, and cross-file
      declarations.
    - Optional test to behavior and code, or code to related tests.
  local_source_adapter:
    revision: Full commit ID, HEAD, or fully qualified local branch/tag ref.
    browse: >-
      Optional bounded inventory of committed .ts paths from verified Git
      metadata; blobs are read only after selection.
    repository_scope: >-
      --scope repository admits all regular committed .ts blobs up to 1,000
      files and 32 MiB total, plus bounded pinned project/workspace metadata.
      Over-limit or unsafe inventories fail explicitly without a partial run.
    selection: >-
      Repository scope or explicit literal .ts paths/an atomic module set from a
      complete pinned inventory; no inferred dependency closure.
    worktree: Dirty working-tree contents are ignored.
  presentation: >-
    A bounded textual CLI plus an opt-in ephemeral loopback browser proof for
    the current semantic snapshot. A persistent product frontend remains gated.
research:
  title_role:
    The official thesis title is academic metadata, not a mandatory product
    entry path.
  questions:
    - Accuracy and time compared with conventional source inspection.
    - Additional value of visualization over equivalent textual information.
  conditions: [IDE baseline, textual trace, visual trace]
  measures:
    [
      correctness,
      time,
      unsupported conclusions,
      confidence calibration,
      usability,
    ]
  ai: Separate optional evaluation; disabled by default.
non_goals:
  - Requirement-impact, approval, report-generation, or enterprise workflows.
  - Team tenancy, cloud source ingestion, or arbitrary runtime execution.
  - Interpreting dirty working-tree source, non-Git folders, or broad language
    support in V0.
  - A general AI coding platform, custom issue tracker, or speculative
    infrastructure.
first_batch:
  deliverables: [Foundation, DB-01]
  stop_before: DB-02
  approval: Explicit user approval is required before DB-02.
semantic_proof:
  input:
    Caller-supplied immutable UTF-8 manifests or pinned repository source with
    hash-verified compiler/workspace metadata in a virtual filesystem.
  capabilities: >-
    Named functions, body-bearing identifier-named class methods as call owners,
    supported direct identifier calls and partial source-backed method
    references. TypeScript config aliases, relative imports and workspace
    entries resolve only when the pinned compiler context proves a source path.
  exclusions:
    Re-exports, overload targets, dynamic dispatch, unsupported syntax,
    JavaScript, .tsx and external implementations remain unresolved or
    unsupported as appropriate.
  persistence:
    Repository and project sessions are in memory only. PostgreSQL and durable
    source/provenance storage remain behind DB-02 and later approval gates.
