id: CT-DB-012
title: 'Bounded deterministic queries'
module: contracts
statement: >
  Source/evidence, graph and optional test read contracts shall be
  snapshot-scoped, deterministic and bounded with explicit truncation.
lifecycle: accepted
priority: must
acceptance:
  - id: AC-01
    given: 'A valid query and a published snapshot'
    then:
      'A validated projection reports static evidence basis, coverage and
      applied limits.'
  - id: AC-02
    given: 'A cursor reused with another snapshot, query, filter or ordering'
    then: 'Validation rejects it.'
  - id: AC-03
    given: 'A result exceeding a declared bound'
    then:
      'The result reports truncation without fabricated or dangling graph
      endpoints.'
  - id: AC-04
    given: 'A paginated or graph result and its original request'
    then:
      'Request-aware validation checks continuation, ordering, roots, direction
      and bounds without guessing missing context.'
depends_on:
  - CT-DB-002
  - CT-DB-005
  - CT-DB-008
verification:
  method: mixed
