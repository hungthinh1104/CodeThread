id: CT-EVAL-001
title: 'Independent comprehension evaluation'
module: evaluation
statement: >
  Comprehension effectiveness shall be evaluated independently across IDE
  baseline, textual trace and information-equivalent visual trace conditions.
lifecycle: accepted
priority: must
acceptance:
  - id: AC-01
    given: 'A code-comprehension study with optional test-supported tasks'
    then:
      'Correctness, time, unsupported conclusions, confidence calibration and
      usability are collected with provenance.'
  - id: AC-02
    given: 'Only implementation or schema tests have passed'
    then:
      'No comprehension improvement or semantic extraction accuracy is claimed.'
  - id: AC-03
    given: 'A future AI study'
    then:
      'Its treatment and conclusions remain separate from the visualization
      comparison.'
  - id: AC-04
    given:
      'A structurally valid participant answer cites incorrect source evidence'
    then:
      'The original citation remains unchanged, the dataset remains valid, and
      the incorrect evidence anchor earns zero.'
  - id: AC-05
    given:
      'A result is marked tool_failure, with or without captured partial answers'
    then:
      'The failure remains separately counted and the entire record is excluded
      from objective denominators and missed-answer counts.'
  - id: AC-06
    given: 'A result dataset is prepared for collection or scoring'
    then:
      'Its provenance binds the canonical task bank, scoring policy, study
      version, and exact clean scorer commit; mismatches fail without migration.'
  - id: AC-07
    given: 'An answer key used by a result has not passed independent review'
    then:
      'Participant scoring is refused; only the separately labeled synthetic
      engineering demonstration may use that answer key.'
  - id: AC-08
    given:
      'A task prompt conflicts with its pinned source scope or presentation
      parity'
    then:
      'The task is excluded from the affected research comparison until its
      wording, answer key, and accessible evidence are independently reviewed.'
depends_on:
  - CT-TRACE-001
verification:
  method: study
