id: CT-INDEX-001
title: Bounded semantic proof
module: symbol-indexer
statement: >
  The next in-memory semantic proof shall connect selected TypeScript symbols to
  supported cross-file relationships and exact source evidence without
  persistence.
lifecycle: accepted
priority: must
acceptance:
  - id: AC-01
    given: An immutable source manifest and a selected symbol
    then:
      Supported declarations, imports, references and direct calls have
      deterministic occurrence identities and source evidence.
  - id: AC-02
    given: Dynamic, ambiguous, missing or unsupported targets
    then:
      Diagnostics and coverage retain uncertainty without fabricated exact
      relationships.
  - id: AC-03
    given: A semantic evaluation
    then:
      Pre-prediction source-pinned annotations define precision, recall and
      unresolved-rate denominators. Post-prediction corrections stay disclosed
      for audit and are excluded from acceptance metrics.
  - id: AC-04
    given: Untrusted source or a resource limit
    then:
      A bounded virtual compiler host reads only supplied files and pinned
      compiler libraries and never executes target code or installs
      dependencies.
  - id: AC-05
    given: >-
      The same pinned source is analyzed through more than one TypeScript
      project configuration
    then: >-
      Each context has a distinct snapshot identity containing its verified
      source, configuration and resolution inputs. Resolution stays within that
      context; project facts are not merged, and missing or ambiguous paths
      retain diagnostics instead of guessed relationships.
  - id: AC-06
    given: A selected-file or repository resource profile
    then: >-
      Source admission, worker extraction, fact validation and trace validation
      share that profile's finite limits. Repository contexts run sequentially;
      resource exhaustion and cancellation produce typed incomplete/failure
      states rather than an empty successful snapshot.
depends_on:
  - CT-CORE-004
  - CT-CORE-005
  - CT-DB-005
  - CT-DB-007
verification:
  method: mixed
  description: >
    CT-INDEX-001A verifies a bounded named-function/direct-call subset against
    source-pinned authored annotations. CT-INDEX-001B adds a bounded
    source-backed method-reference subset and kind-filtered graph traversal;
    body-bearing identifier-named class methods are also supported as owners of
    direct identifier calls. Nested named functions keep their own ownership;
    callback and unsupported owner scopes retain uncertainty. Broader imports
    and general reference capabilities remain unimplemented. The pinned external
    labels have no independent review. Post-prediction corrections are disclosed
    and excluded from acceptance denominators. Repository mode analyzes up to
    1,000 pinned .ts sources/32 MiB in distinct TypeScript project snapshots
    with pinned compiler-library hashes; `.tsx`, JavaScript, ambient machine
    types and general dynamic dispatch remain outside the supported subset.
