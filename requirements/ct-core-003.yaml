id: CT-CORE-003
title: 'Explicit module boundaries'
module: foundation
statement: >
  Packages shall use declared public dependencies without package cycles,
  cross-module deep imports or framework dependencies in the semantic core.
lifecycle: accepted
priority: must
acceptance:
  - id: AC-01
    given: 'A valid core or contract import'
    then: 'Architecture checks accept its declared public entry point.'
  - id: AC-02
    given:
      'A forbidden dependency, package cycle or cross-package relative import'
    then: 'Architecture checks fail.'
  - id: AC-03
    given:
      'An internal source import cycle or a contracts implementation import
      through a compatibility facade'
    then: 'Architecture checks reject the dependency.'
  - id: AC-04
    given: 'A module covered by the staged size rules'
    then:
      'Lint rejects production files over 500 physical lines, production
      functions over 150 lines and test files over 700 lines unless a reviewed
      exception records its owner, reason, baseline and maximum.'
depends_on:
  - CT-CORE-001
verification:
  method: automated
