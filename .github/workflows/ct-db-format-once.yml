name: One-time backend candidate formatting
on:
  push:
    branches: [feat/ct-db-be-002]
permissions:
  contents: write
jobs:
  prettier-once:
    if: "github.event.head_commit.message == 'chore(format): launch isolated backend formatting'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write scripts/backend/persistence.ts
      - run: |
          git add -- scripts/backend/persistence.ts
          if ! git diff --cached --quiet; then
            git -c user.name='CodeThread Formatting Bot' \
              -c user.email='codethread-format@users.noreply.github.com' \
              commit -m 'style(backend): apply pinned Prettier'
            git push origin HEAD:refs/heads/feat/ct-db-be-002
          fi
