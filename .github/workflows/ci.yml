name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Configure bounded APT retries for Chromium dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99codethread-retries >/dev/null
      - name: Install Chromium for visual investigation tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium for visual investigation tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Browser-level visual investigation
        run: pnpm test:browser
      - name: Semantic fixture evaluation
        run: pnpm --silent eval:semantic
      - name: Pinned external semantic and graph evaluation
        run: pnpm --silent eval:external
      - name: Dependency security audit (requires advisory service)
        run: pnpm security:check
