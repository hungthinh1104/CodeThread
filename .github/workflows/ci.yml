name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Configure bounded APT retries for Chromium dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Load after runner-images' zz-retries so these bounded values take effect.
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/zzzz-codethread-retries >/dev/null
          echo 'Effective APT acquire configuration'
          sudo apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          echo 'Ubuntu APT mirrors'
          sudo cat /etc/apt/apt-mirrors.txt
      - name: Install Chromium for visual investigation tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium for visual investigation tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - run: pnpm check
      - name: Report installed analyzer build identity
        run:
          node --input-type=module -e "import { analyzerBuildHash } from
          '@codethread/symbol-indexer'; console.log('analyzerBuildHash=' +
          analyzerBuildHash())"
      - name: Browser-level visual investigation
        run: pnpm test:browser
      - name: Semantic fixture evaluation
        run: pnpm --silent eval:semantic
      - name: Pinned external semantic and graph evaluation
        run: pnpm --silent eval:external
      - name: Dependency security audit (requires advisory service)
        run: pnpm security:check
      - name: Detect Workspace changes
        id: workspace-diff
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          git diff --quiet "$BASE_SHA" HEAD -- \
            packages/investigation-workspace packages/contracts packages/code-model scripts/viewer.css \
            'scripts/viewer*.ts' 'tests/browser/workspace-*.ts' \
            pnpm-lock.yaml .github/workflows/ci.yml || status=$?
          case "$status" in
            0) echo 'changed=false' >> "$GITHUB_OUTPUT" ;;
            1) echo 'changed=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Capture Workspace fixture evidence
        if: steps.workspace-diff.outputs.changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VISUAL_OUTPUT: ${{ runner.temp }}/workspace-visual
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          baseline='.tooling/workspace-design-baseline'
          git worktree add --detach "$baseline" "$BASE_SHA"
          cp tests/browser/workspace-design-evidence.ts \
            tests/browser/workspace-presentation.ts tests/browser/workspace-zoom.ts \
            tests/browser/workspace-app.ts \
            "$baseline/tests/browser/"
          (
            cd "$baseline"
            pnpm install --frozen-lockfile
            pnpm build
            node tests/browser/workspace-design-evidence.ts before "$VISUAL_OUTPUT/before" "$BASE_SHA"
            node tests/browser/workspace-zoom.ts "$VISUAL_OUTPUT/before" before
          )
          node tests/browser/workspace-design-evidence.ts after "$VISUAL_OUTPUT/after" "$GITHUB_SHA"
          node tests/browser/workspace-zoom.ts "$VISUAL_OUTPUT/after"
          node tests/browser/workspace-design-evidence.ts compare "$VISUAL_OUTPUT"
          printf '{"base":"%s","prHead":"%s","checkout":"%s"}\n' \
            "$BASE_SHA" "$PR_HEAD_SHA" "$GITHUB_SHA" > "$VISUAL_OUTPUT/revisions.json"
      - name: Upload Workspace fixture evidence
        if: steps.workspace-diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workspace-visual-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/workspace-visual/before/*.png
            ${{ runner.temp }}/workspace-visual/before/*.json
            ${{ runner.temp }}/workspace-visual/after/*.png
            ${{ runner.temp }}/workspace-visual/after/*.json
            ${{ runner.temp }}/workspace-visual/comparison.json
            ${{ runner.temp }}/workspace-visual/revisions.json
          if-no-files-found: error
          retention-days: 30

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codethread
          POSTGRES_USER: codethread
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codethread -d codethread"
          --health-interval 5s --health-timeout 5s --health-retries 20
      restartdb:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codethread_restart_test
          POSTGRES_USER: codethread
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5433:5432
        options: >-
          --label codethread.test=restart-only --health-cmd "pg_isready -U
          codethread -d codethread_restart_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CODETHREAD_MIGRATION_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread
      CODETHREAD_TEST_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm backend:migrate
      - run: pnpm backend:roles
      - run: pnpm backend:roles
      - name: Configure bounded APT retries for PostgreSQL browser tests
        run: |
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/zzzz-codethread-retries >/dev/null
      - name: Install Chromium for persistent viewer tests
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      # These suites migrate and exercise the same disposable schema, so keep
      # Vitest file workers sequential to prevent cross-suite schema races.
      - run:
          pnpm exec vitest run tests/backend-integration.test.ts
          tests/backend-api-contract.test.ts
          tests/backend-migration-integrity.test.ts
          tests/backend-http-restart.test.ts tests/backend-queue-limit.test.ts
          tests/backend-driver-loss.test.ts tests/backend-worker-lock.test.ts
          tests/backend-worker-connection-loss.test.ts
          tests/backend-worker-lease.test.ts tests/backend-shutdown.test.ts
          tests/backend-partial-session.test.ts
          tests/backend-benchmark-telemetry.test.ts
          tests/backend-query-admission.test.ts
          tests/backend-release-gate.test.ts
          tests/backend-worker-readiness.test.ts
          tests/backend-worker-probe.test.ts
          tests/backend-persistent-browser.test.ts --maxWorkers=1
      - name: Verify restart of a dedicated PostgreSQL service
        env:
          CODETHREAD_RESTART_TEST_CONTAINER: ${{ job.services.restartdb.id }}
          CODETHREAD_RESTART_TEST_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5433/codethread_restart_test
        run:
          pnpm exec vitest run tests/backend-database-restart.test.ts
          --maxWorkers=1
      - name: Verify schema backup and isolated restore
        env:
          CODETHREAD_BACKUP_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread
          CODETHREAD_RESTORE_TEST_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread_restore
          CODETHREAD_BACKUP_FILE: ${{ runner.temp }}/codethread-backend.dump
          CODETHREAD_PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$CODETHREAD_PG_TOOLS_CONTAINER" createdb -U codethread codethread_restore
          pnpm backend:backup
          pnpm backend:restore:verify
