name: Foundation checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Configure bounded APT retries for Chromium dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Load after runner-images' zz-retries so these bounded values take effect.
          printf '%s\n' \
            'Acquire::Retries "1";' \
            'Acquire::http::Timeout "15";' \
            'Acquire::https::Timeout "15";' \
            | sudo tee /etc/apt/apt.conf.d/zzzz-codethread-retries >/dev/null
          echo 'Effective APT acquire configuration'
          sudo apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          echo 'Ubuntu APT mirrors'
          sudo cat /etc/apt/apt-mirrors.txt
      - name: Install Chromium for visual investigation tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium for visual investigation tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Browser-level visual investigation
        run: pnpm test:browser
      - name: Semantic fixture evaluation
        run: pnpm --silent eval:semantic
      - name: Pinned external semantic and graph evaluation
        run: pnpm --silent eval:external
      - name: Dependency security audit (requires advisory service)
        run: pnpm security:check

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codethread
          POSTGRES_USER: codethread
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codethread -d codethread"
          --health-interval 5s --health-timeout 5s --health-retries 20
      restartdb:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codethread_restart_test
          POSTGRES_USER: codethread
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5433:5432
        options: >-
          --label codethread.test=restart-only --health-cmd "pg_isready -U
          codethread -d codethread_restart_test" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      CODETHREAD_MIGRATION_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread
      CODETHREAD_TEST_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm backend:migrate
      - run: pnpm backend:roles
      - run: pnpm backend:roles
      # These suites migrate and exercise the same disposable schema, so keep
      # Vitest file workers sequential to prevent cross-suite schema races.
      - run:
          pnpm exec vitest run tests/backend-integration.test.ts
          tests/backend-migration-integrity.test.ts
          tests/backend-http-restart.test.ts tests/backend-queue-limit.test.ts
          tests/backend-driver-loss.test.ts tests/backend-worker-lock.test.ts
          tests/backend-worker-connection-loss.test.ts
          tests/backend-worker-lease.test.ts tests/backend-shutdown.test.ts
          tests/backend-partial-session.test.ts
          tests/backend-benchmark-telemetry.test.ts
          tests/backend-query-admission.test.ts --maxWorkers=1
      - name: Verify restart of a dedicated PostgreSQL service
        env:
          CODETHREAD_RESTART_TEST_CONTAINER: ${{ job.services.restartdb.id }}
          CODETHREAD_RESTART_TEST_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5433/codethread_restart_test
        run:
          pnpm exec vitest run tests/backend-database-restart.test.ts
          --maxWorkers=1
      - name: Verify schema backup and isolated restore
        env:
          CODETHREAD_BACKUP_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread
          CODETHREAD_RESTORE_TEST_DATABASE_URL: postgres://codethread:integration-only-password@127.0.0.1:5432/codethread_restore
          CODETHREAD_BACKUP_FILE: ${{ runner.temp }}/codethread-backend.dump
          CODETHREAD_PG_TOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$CODETHREAD_PG_TOOLS_CONTAINER" createdb -U codethread codethread_restore
          pnpm backend:backup
          pnpm backend:restore:verify
